notifications:
  ciscoConfigManEvent:
    module: CISCO-CONFIG-MAN-MIB
    oid: 1.3.6.1.4.1.9.9.43.2.0.1
    objects:
    - name: ccmHistoryEventCommandSource
      module: CISCO-CONFIG-MAN-MIB
      oid: 1.3.6.1.4.1.9.9.43.1.1.6.1.3
      index:
      - ccmHistoryEventIndex
    - name: ccmHistoryEventConfigSource
      module: CISCO-CONFIG-MAN-MIB
      oid: 1.3.6.1.4.1.9.9.43.1.1.6.1.4
      index:
      - ccmHistoryEventIndex
    - name: ccmHistoryEventConfigDestination
      module: CISCO-CONFIG-MAN-MIB
      oid: 1.3.6.1.4.1.9.9.43.1.1.6.1.5
      index:
      - ccmHistoryEventIndex
    - name: ccmHistoryEventTerminalUser
      module: CISCO-CONFIG-MAN-MIB
      oid: 1.3.6.1.4.1.9.9.43.1.1.6.1.8
      index:
      - ccmHistoryEventIndex
    description: Notification of a configuration management event as recorded in ccmHistoryEventTable.
  cpwVcDown:
    module: CISCO-IETF-PW-MIB
    oid: 1.3.6.1.4.1.9.10.106.2.1
    objects:
    - name: cpwVcOperStatus
      module: CISCO-IETF-PW-MIB
      oid: 1.3.6.1.4.1.9.10.106.1.2.1.26
      index:
      - cpwVcIndex
    - name: cpwVcOperStatus
      module: CISCO-IETF-PW-MIB
      oid: 1.3.6.1.4.1.9.10.106.1.2.1.26
      index:
      - cpwVcIndex
    description: This notification is generated when the cpwVcOperStatus object for one or more contiguous
      entries in cpwVcTable are about to enter the down(2) state from some other state. The included values
      of cpwVcOperStatus MUST all be set equal to this down(2) state. The two instances of cpwVcOperStatus
      in this notification indicate the range of indexes that are affected. Note that all the indexes
      of the two ends of the range can be derived from the instance identifiers of these two objects.
      For cases where a contiguous range of cross-connects have transitioned into the down(2) state at
      roughly the same time, the device SHOULD issue a single notification for each range of contiguous
      indexes in an effort to minimize the emission of a large number of notifications. If a notification
      has to be issued for just a single cross-connect entry, then the instance identifier (and values)
      of the two cpwVcOperStatus objects MUST be identical.
  cpwVcUp:
    module: CISCO-IETF-PW-MIB
    oid: 1.3.6.1.4.1.9.10.106.2.2
    objects:
    - name: cpwVcOperStatus
      module: CISCO-IETF-PW-MIB
      oid: 1.3.6.1.4.1.9.10.106.1.2.1.26
      index:
      - cpwVcIndex
    - name: cpwVcOperStatus
      module: CISCO-IETF-PW-MIB
      oid: 1.3.6.1.4.1.9.10.106.1.2.1.26
      index:
      - cpwVcIndex
    description: 'This notification is generated when the cpwVcOperStatus object for one or more contiguous
      entries in cpwVcTable are about to enter the up(1) state from some other state. The included values
      of cpwVcOperStatus MUST both be set equal to this new state (i.e: up(1)). The two instances of cpwVcOperStatus
      in this notification indicate the range of indexes that are affected. Note that all the indexes
      of the two ends of the range can be derived from the instance identifiers of these two objects.
      For cases where a contiguous range of cross-connects have transitioned into the up(1) state at roughly
      the same time, the device SHOULD issue a single notification for each range of contiguous indexes
      in an effort to minimize the emission of a large number of notifications. If a notification has
      to be issued for just a single cross-connect entry, then the instance identifier (and values) of
      the two cpwVcOperStatus objects MUST be the identical.'
  coldStart:
    module: SNMPv2-MIB
    oid: 1.3.6.1.6.3.1.1.5.1
    objects: []
    description: A coldStart trap signifies that the SNMP entity, supporting a notification originator
      application, is reinitializing itself and that its configuration may have been altered.
  linkDown:
    module: IF-MIB
    oid: 1.3.6.1.6.3.1.1.5.3
    objects:
    - name: ifIndex
      module: IF-MIB
      oid: 1.3.6.1.2.1.2.2.1.1
      index:
      - ifIndex
    - name: ifAdminStatus
      module: IF-MIB
      oid: 1.3.6.1.2.1.2.2.1.7
      index:
      - ifIndex
    - name: ifOperStatus
      module: IF-MIB
      oid: 1.3.6.1.2.1.2.2.1.8
      index:
      - ifIndex
    description: A linkDown trap signifies that the SNMP entity, acting in an agent role, has detected
      that the ifOperStatus object for one of its communication links is about to enter the down state
      from some other state (but not from the notPresent state). This other state is indicated by the
      included value of ifOperStatus.
  linkUp:
    module: IF-MIB
    oid: 1.3.6.1.6.3.1.1.5.4
    objects:
    - name: ifIndex
      module: IF-MIB
      oid: 1.3.6.1.2.1.2.2.1.1
      index:
      - ifIndex
    - name: ifAdminStatus
      module: IF-MIB
      oid: 1.3.6.1.2.1.2.2.1.7
      index:
      - ifIndex
    - name: ifOperStatus
      module: IF-MIB
      oid: 1.3.6.1.2.1.2.2.1.8
      index:
      - ifIndex
    description: A linkUp trap signifies that the SNMP entity, acting in an agent role, has detected that
      the ifOperStatus object for one of its communication links left the down state and transitioned
      into some other state (but not into the notPresent state). This other state is indicated by the
      included value of ifOperStatus.
