# Zabbix 8.0 monitoring of the lab (owner: 04-zabbix). See zabbix/README.md and docs/reports/04-zabbix.md.
#
#   zabbix-server     Zabbix server (SNMP polling, SNMP trapper, LLD, services/BSM, webhook "check now")
#                     labnet 172.30.10.40
#   zabbix-web        frontend + API (nginx/PHP on :8080): labnet 172.30.10.41, published on 127.0.0.1:8080
#   zabbix-snmptraps  snmptrapd on udp/1162: labnet 172.30.10.42; writes traps into the shared volume that the
#                     server's SNMP trapper reads
#   zabbix-postgres   PostgreSQL 18, internal network only (zabbix-internal)
#
# Images: Zabbix 8.0.0rc1 built from Zabbix's own Dockerfiles (zabbix/images/build-images.sh, `make zabbix-images`),
# because Zabbix publishes no image tags for 8.0 pre-releases. Planned bump: 8.0.0 GA from Docker Hub
# (zabbix/zabbix-*:alpine-8.0.0) as soon as it is released.
# First start: the server creates the database schema; `make zabbix-up` then runs `zabbix-bootstrap` (Admin password
# from .env, API user netsim-api with its own role, ZABBIX_API_TOKEN written into .env, check-now script).
# Keep the image tags in sync with ZBX_IMAGE_TAG in zabbix/images/build-images.sh (a unit test checks it).
x-zabbix-db-env: &zabbix-db-env
  DB_SERVER_HOST: zabbix-postgres
  DB_SERVER_PORT: "5432"
  POSTGRES_DB: ${ZABBIX_DB_NAME}
  POSTGRES_USER: ${ZABBIX_DB_USER}
  POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}

services:
  zabbix-server:
    image: netsim/zabbix-server-pgsql:8.0.0rc1-alpine
    container_name: zabbix-server
    hostname: zabbix-server
    init: true
    environment:
      <<: *zabbix-db-env
      # SNMP trapper (reads /var/lib/zabbix/snmptraps/snmptraps.log written by zabbix-snmptraps).
      ZBX_ENABLE_SNMP_TRAPS: "true"
      # Not needed: webhook scripts always run (only "Script" type commands on the server are gated by it;
      # src/libs/zbxscripts/scripts.c in 8.0.0rc1). Kept off, as Zabbix ships new installations.
      ZBX_ENABLEGLOBALSCRIPTS: "0"
      # Speed (small lab, cheap): config changes (macros, new items) and BSM changes apply within seconds.
      ZBX_CACHEUPDATEFREQUENCY: "5"
      ZBX_SERVICEMANAGERSYNCFREQUENCY: "5"
      ZBX_STARTSNMPPOLLERS: "2"
      ZBX_STARTPOLLERS: "5"
      ZBX_STARTTRAPPERS: "5"
      ZBX_STARTLLDPROCESSORS: "4"
      ZBX_STARTESCALATORS: "2"
      ZBX_TIMEOUT: "5"
      # A powered-off device: interface unreachable after 15 s instead of 45 s.
      ZBX_UNREACHABLEPERIOD: "15"
      ZBX_UNREACHABLEDELAY: "5"
      ZBX_UNAVAILABLEDELAY: "15"
    networks:
      labnet:
        ipv4_address: 172.30.10.40
        gw_priority: 1
      zabbix-internal: {}
    volumes:
      - zabbix-snmptraps:/var/lib/zabbix/snmptraps:ro
    depends_on:
      zabbix-postgres:
        condition: service_healthy
    healthcheck:
      # Runtime control goes through the running server's IPC socket: fails until the server is up.
      test: ["CMD", "/usr/sbin/zabbix_server", "-R", "ha_status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s
    stop_grace_period: 30s
    restart: unless-stopped

  zabbix-web:
    image: netsim/zabbix-web-nginx-pgsql:8.0.0rc1-alpine
    container_name: zabbix-web
    hostname: zabbix-web
    environment:
      <<: *zabbix-db-env
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_PORT: "10051"
      ZBX_SERVER_NAME: NetSim L2VPN lab
      PHP_TZ: UTC
    networks:
      labnet:
        ipv4_address: 172.30.10.41
        gw_priority: 1
      zabbix-internal: {}
    ports:
      - 127.0.0.1:8080:8080/tcp
    tmpfs:
      - /tmp
      - /var/lib/php/session:mode=1777
    depends_on:
      zabbix-postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    restart: unless-stopped

  zabbix-snmptraps:
    image: netsim/zabbix-snmptraps:8.0.0rc1-alpine
    container_name: zabbix-snmptraps
    hostname: zabbix-snmptraps
    read_only: true
    environment:
      # Numeric OIDs (-On, the Zabbix trap items match by numeric OID) while the mounted MIBs still decode values
      # (strings, enum labels such as lowerLayerDown(7)); T: printable hex strings; t: raw TimeTicks.
      SNMPTRAP_OUTPUT_OPTIONS: nTt
      ZBX_SNMP_TRAP_USE_DNS: "false"
    networks:
      labnet:
        ipv4_address: 172.30.10.42
        gw_priority: 1
    volumes:
      - zabbix-snmptraps:/var/lib/zabbix/snmptraps:rw
      - ../contract/mibs:/var/lib/zabbix/mibs:ro
    tmpfs:
      - /tmp
      - /var/lib/zabbix/snmptrapd_config
    healthcheck:
      test: ["CMD-SHELL", "netstat -lnu | grep -q ':1162 '"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
    restart: unless-stopped

  zabbix-postgres:
    image: postgres:18.6-alpine3.24
    container_name: zabbix-postgres
    hostname: zabbix-postgres
    environment:
      POSTGRES_DB: ${ZABBIX_DB_NAME}
      POSTGRES_USER: ${ZABBIX_DB_USER}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD}
    networks:
      - zabbix-internal
    volumes:
      # PostgreSQL 18 images keep PGDATA under /var/lib/postgresql/18/docker (the volume is the parent).
      - zabbix-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -q -t 2 -d "$$POSTGRES_DB" -U "$$POSTGRES_USER"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    restart: unless-stopped

networks:
  labnet:
    external: true
  zabbix-internal:
    internal: true

volumes:
  zabbix-postgres-data: {}
  zabbix-snmptraps: {}
