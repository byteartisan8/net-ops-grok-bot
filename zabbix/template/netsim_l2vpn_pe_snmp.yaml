            - uuid: 031910d99b7546a4b53871949d29068b
              name: 'PW {#SERVICE} {#ROLE}: device row'
              type: DEPENDENT
              key: netsim.pw.row[{#SERVICE},{#ROLE}]
              history: 7d
              value_type: JSON
              description: 'The cpwVcTable row named {#SERVICE}:{#ROLE} as JSON (present, index, oper, admin, peer as dotted
                quad, vc_id, remote_mtu, customer), or present=0 with defined ''absent'' values. Found by JavaScript in every
                walk value. NetBox spec: VC ID {#VC_ID}, peer {#EXPECTED_PEER} ({#EXPECTED_PEER_HOST}), AC {#AC}, customer
                {#CUSTOMER}.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      // NetSim: helpers for a Zabbix SNMP walk[] value (prepended to the scripts that read the raw walk).
                      // Format (Zabbix 8.0 poller): one ".<numeric OID> = <TYPE>: <value>" line per varbind, numeric enums and TimeTicks,
                      // strings quoted with \" and \\ escaped, an empty string as "" without a type, octets that are not printable
                      // UTF-8 as "Hex-STRING: 0A FF 00 01".
                      function nsWalk(text) {
                          var out = {};
                          var lines = String(text).split('\n');
                          for (var i = 0; i < lines.length; i++) {
                              var m = /^\.?([0-9]+(?:\.[0-9]+)*) = (?:([A-Za-z0-9-]+): )?(.*)$/.exec(lines[i]);
                              if (m) {
                                  out[m[1]] = {type: m[2] || 'STRING', value: m[3]};
                              }
                          }
                          return out;
                      }

                      function nsString(v) {
                          if (!v) {
                              return '';
                          }
                          var s = v.value;
                          if (s.length >= 2 && s.charAt(0) === '"' && s.charAt(s.length - 1) === '"') {
                              s = s.slice(1, -1).replace(/\\(["\\])/g, '$1');
                          }
                          return s;
                      }

                      function nsInt(v) {
                          var n = v ? parseInt(v.value, 10) : NaN;
                          return isNaN(n) ? 0 : n;
                      }

                      // InetAddress (4 octets) -> dotted quad; anything else is returned as the raw text.
                      function nsInetAddress(v) {
                          if (!v) {
                              return '';
                          }
                          var bytes = [];
                          var i;
                          if (v.type === 'Hex-STRING') {
                              var parts = v.value.trim().split(/\s+/);
                              for (i = 0; i < parts.length; i++) {
                                  bytes.push(parseInt(parts[i], 16));
                              }
                          }
                          else {
                              var s = nsString(v);
                              for (i = 0; i < s.length; i++) {
                                  bytes.push(s.charCodeAt(i));
                              }
                          }
                          return bytes.length === 4 ? bytes.join('.') : v.value;
                      }

                      // NetSim: the cpwVcTable row of the expected PW "{#SERVICE}:{#ROLE}" (contract section 8: cpwVcName =
                      // "<service-id>:<role>"), as JSON. A missing row is a defined value ("present": 0), never an error, so the
                      // "missing" check is reliable. Column OIDs come from contract/oids.yaml (generator placeholders).
                      var NAME = '{#SERVICE}:{#ROLE}';
                      var ENTRY = '1.3.6.1.4.1.9.10.106.1.2.1';
                      var walk = nsWalk(value);
                      var prefix = ENTRY + '.21.';

                      for (var oid in walk) {
                          if (oid.indexOf(prefix) === 0 && nsString(walk[oid]) === NAME) {
                              var idx = oid.substring(prefix.length);
                              var col = function (c) {
                                  return walk[ENTRY + '.' + c + '.' + idx];
                              };
                              return JSON.stringify({
                                  present: 1,
                                  index: parseInt(idx, 10),
                                  name: NAME,
                                  oper: nsInt(col('26')),
                                  admin: nsInt(col('25')),
                                  peer: nsInetAddress(col('9')),
                                  vc_id: nsInt(col('10')),
                                  remote_mtu: nsInt(col('17')),
                                  customer: nsString(col('22'))
                              });
                          }
                      }

                      return JSON.stringify({
                          present: 0, index: 0, name: NAME, oper: 0, admin: 0, peer: 'absent', vc_id: 0, remote_mtu: 0, customer: ''
                      });
              master_item:
                key: netsim.snmp.walk
              tags:
                - tag: component
                  value: pw
                - tag: pw_role
                  value: '{#ROLE}'
                - tag: service
                  value: '{#SERVICE}'
            - uuid: 449171f575a84bea84fe4edc59cb5754
              name: 'PW {#SERVICE} {#ROLE}: difference from NetBox'
              type: DEPENDENT
              key: netsim.pw.spec_diff[{#SERVICE},{#ROLE}]
              history: 7d
              value_type: CHAR
              description: 'How the row differs from its NetBox spec, in words (used in the ''spec'' event name): ''matches
                NetBox'', ''absent'', or e.g. ''peer 10.255.0.2, NetBox expects 10.255.0.1 (hub-a)''.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      // NetSim: how the PW row differs from its NetBox spec, in words (used in the "spec" event name), e.g.
                      // "peer 10.255.0.2, NetBox expects 10.255.0.1 (hub-a)". "matches NetBox" when it doesn't, "absent" without a row.
                      var row = JSON.parse(value);
                      if (!row.present) {
                          return 'absent';
                      }
                      var diff = [];
                      if (row.peer !== '{#EXPECTED_PEER}') {
                          diff.push('peer ' + row.peer + ', NetBox expects {#EXPECTED_PEER} ({#EXPECTED_PEER_HOST})');
                      }
                      if (row.vc_id !== {#VC_ID}) {
                          diff.push('VC ID ' + row.vc_id + ', NetBox expects {#VC_ID}');
                      }
                      return diff.length ? diff.join('; ') : 'matches NetBox';
              master_item:
                key: netsim.pw.row[{#SERVICE},{#ROLE}]
