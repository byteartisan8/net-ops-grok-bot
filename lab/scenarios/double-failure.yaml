name: double-failure
title: Both hubs lost
description: >
  hub-a's uplink fails and hub-b is powered off: no service has a working PW left, all six are down (Disaster).
  Each service gets two fault findings, one per cause.
# Power-off: the peers notice after the 3 s advert hold time (contract 7), then trap -> check-now waits for Zabbix
# 8.0's fixed 5 s task-manager grid (04): measured 5.4-9.7 s, median 7.9 s; budget 12 s (contract change log, 05).
budget_s: 12
steps:
  - fault: {uplink: hub-a}
  - device: {stop: hub-b}
expect:
  pws:
    SVC-0001 primary: {spoke-1: down/peer-unreachable, hub-a: lowerLayerDown/local-uplink-down}
    SVC-0002 primary: {spoke-2: down/peer-unreachable, hub-a: lowerLayerDown/local-uplink-down}
    SVC-0003 primary: {spoke-2: down/peer-unreachable, hub-a: lowerLayerDown/local-uplink-down}
    SVC-0004 primary: {spoke-3: down/peer-unreachable, hub-a: lowerLayerDown/local-uplink-down}
    SVC-0005 primary: {spoke-4: down/peer-unreachable, hub-a: lowerLayerDown/local-uplink-down}
    SVC-0006 primary: {spoke-4: down/peer-unreachable, hub-a: lowerLayerDown/local-uplink-down}
    SVC-0001 backup: {spoke-1: down/peer-unreachable, hub-b: unreachable}
    SVC-0002 backup: {spoke-2: down/peer-unreachable, hub-b: unreachable}
    SVC-0003 backup: {spoke-2: down/peer-unreachable, hub-b: unreachable}
    SVC-0004 backup: {spoke-3: down/peer-unreachable, hub-b: unreachable}
    SVC-0005 backup: {spoke-4: down/peer-unreachable, hub-b: unreachable}
    SVC-0006 backup: {spoke-4: down/peer-unreachable, hub-b: unreachable}
  zabbix:
    services: {default: Disaster}
  drift:
    findings:
      - {service: "*", class: fault, kind: uplink-down, hosts: [hub-a], match: "primary PW down: hub-a core uplink down \\(fault\\); service down"}
      - {service: "*", class: fault, kind: device-down, hosts: [hub-b], match: "backup PW down: hub-b powered off .*; service down"}
