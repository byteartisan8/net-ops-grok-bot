[project]
name = "netsim-common"
version = "0.1.0"
description = "Shared models and contract helpers for the NetSim L2VPN lab (owner: 01-foundation)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1,<3",
    "pyyaml>=6.0.3,<7",
]

[project.scripts]
netsim-contract = "netsim_common.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netsim_common"]
