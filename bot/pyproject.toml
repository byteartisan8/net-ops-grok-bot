# grok-bot (owner: 07-grok-bot; the office of three roles since 09-noc-roles): Zabbix pages it with customer alerts,
# it batches them into incidents and pages the three NOC roles (Grok Bot app routines), serves their tools on /mcp,
# runs the human-approved change tickets, and shows the "NOC room". It only talks HTTP (lab-api, the routines'
# webhooks); it imports no other workspace package.
[project]
name = "netsim-bot"
version = "0.2.0"
description = "NetSim NOC office: Zabbix customer alerts, three NOC roles on MCP, approved changes, the NOC room"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Same pins as lab-api and simd (sessions 02 and 05).
    "fastapi==0.141.1",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
    # botctl, same pins as labctl.
    "typer==0.27.2",
    "rich==15.0.0",
]

[project.scripts]
grok-bot = "netsim_bot.api.server:main"
grok-bot-sink = "netsim_bot.sink:main"
botctl = "netsim_bot.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netsim_bot"]
