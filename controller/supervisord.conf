; controller process supervisor (owner: 10-clixon-controller). supervisord runs as PID 1, as in the PEs
; (devices/supervisord.conf); every program logs to the container's stdout.
; `docker exec controller supervisorctl status`.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=warn

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; The Clixon controller backend: starts from startup_db (the PEs, NACM), reaches the PEs over NETCONF/SSH.
[program:clixon_backend]
command=/opt/clixon/sbin/clixon_backend -F -f /etc/clixon/controller.xml -s startup -l e
priority=10
autorestart=true
startsecs=1
startretries=100
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; SSH on :22 for lab-api: the role users' and lab-api's sessions are the controller CLI.
[program:sshd]
command=/usr/sbin/sshd -D -e -f /etc/ssh/sshd_config
priority=20
autorestart=true
startsecs=1
startretries=100
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Learns the PEs' host keys and connects every PE once the backend is up (again after a backend restart).
[program:controller_agent]
command=/usr/local/bin/controller-agent
priority=30
autorestart=true
startsecs=1
startretries=100
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
