# GENERATED by `make devices-compose` (netsim-devices render-compose) from contract/topology.yaml - DO NOT EDIT.
# Owner: 02-device-simulator. `core` (Valkey signaling bus) + one netsim-pe container per device, all on the
# external network labnet (created by `make net`). Device ports bind to 127.0.0.1 only (contract section 4).
# CORE_URL, TRAP_TARGETS and SNMP_COMMUNITY come from the root .env; the defaults match .env.example
# (TRAP_TARGETS set but empty disables traps). The volume controller-keys (read-only here) brings the Clixon
# controller's public key for NETCONF over SSH on :830, which is not published (labnet only).
services:
  core:
    image: valkey/valkey:8.1.10-alpine3.24
    container_name: core
    hostname: core
    command:
    - valkey-server
    - --save
    - ''
    - --appendonly
    - 'no'
    - --notify-keyspace-events
    - KEg$$x
    networks:
      labnet:
        ipv4_address: 172.30.10.5
    healthcheck:
      test:
      - CMD
      - valkey-cli
      - ping
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped
  hub-a:
    image: netsim/netsim-pe:0.1.0
    build:
      context: ..
      dockerfile: devices/Dockerfile
    container_name: hub-a
    hostname: hub-a
    environment:
      HOSTNAME: hub-a
      MGMT_IP: 172.30.10.11
      SITE: DC-A
      CORE_URL: ${CORE_URL:-redis://172.30.10.5:6379/0}
      TRAP_TARGETS: ${TRAP_TARGETS-172.30.10.42:1162}
      SNMP_COMMUNITY: ${SNMP_COMMUNITY:-netsim}
    networks:
      labnet:
        ipv4_address: 172.30.10.11
    ports:
    - 127.0.0.1:18011:8080/tcp
    - 127.0.0.1:19011:9000/tcp
    - 127.0.0.1:16111:161/udp
    volumes:
    - hub-a-data:/var/lib/netsim
    - controller-keys:/etc/netsim/keys:ro
    depends_on:
      core:
        condition: service_healthy
    healthcheck:
      interval: 5s
