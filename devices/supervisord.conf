; netsim-pe process supervisor (owner: 02-device-simulator). supervisord runs as PID 1 (see devices/README.md
; for why supervisord and not s6-overlay). Every program logs to the container's stdout; simd logs JSON lines.
; Installed as /etc/supervisor/supervisord.conf (supervisorctl's default path): `docker exec <host> supervisorctl status`.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=warn

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

; Clixon backend: YANG datastores on the volume, startup mode "running" (config survives restarts),
; netsim_backend.so emits netconf-config-change on the NETCONF stream.
[program:clixon_backend]
command=/opt/clixon/sbin/clixon_backend -F -f /etc/clixon.xml -l e
priority=10
autorestart=true
startsecs=1
startretries=100
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Native RESTCONF on :8080 (config from /etc/clixon.xml); starts once the backend socket exists.
[program:clixon_restconf]
command=/bin/sh -c 'until [ -S /run/clixon/clixon.sock ]; do sleep 0.1; done; exec /opt/clixon/sbin/clixon_restconf -f /etc/clixon.xml -l e'
priority=20
autorestart=true
startsecs=1
startretries=100
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; SNMP v2c agent on :161/udp; the "netsim" variation module serves the SQLite MIB view written by simd.
; Binds the port as root, then drops to the snmpsim user.
[program:snmpsim]
command=/opt/venv/bin/snmpsim-command-responder
    --data-dir=/run/netsim/snmpsim/data
    --cache-dir=/run/netsim/snmpsim/cache
    --variation-modules-dir=/opt/netsim/snmpsim/variation
    --variation-module-options=netsim:db:/run/netsim/snmp/agent.db
    --agent-udpv4-endpoint=0.0.0.0:161
    --process-user=snmpsim
    --process-group=snmpsim
    --log-level=error
priority=30
autorestart=true
startsecs=1
startretries=100
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; simd: config watch, signaling, PW evaluation, SNMP data, traps, API :9000.
[program:simd]
command=/opt/venv/bin/simd
priority=40
autorestart=true
startsecs=1
startretries=100
stopsignal=TERM
stopwaitsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
